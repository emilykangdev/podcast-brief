name: CI

on:
  push:
    branches: [main]
  pull_request:

# .nvmrc / package.json engines pin 18.20.5 to match what Railway's Nixpacks build actually
# resolves to in production today (verified against a live build log, not assumed) — several
# deps (@arcjet/*, marked, posthog-node) declare `engines >=20` and only warn under npm on 18,
# they don't hard-fail. See PR description for the follow-up this surfaces.
env:
  NODE_VERSION: 18.20.5

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - run: ./scripts/ci/write-test-env.sh .env.test.local
      - run: npm run test:integration

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      # next dev always forces NODE_ENV=development internally, so it only ever reads
      # .env.local — see playwright.config.mjs.
      - run: ./scripts/ci/write-test-env.sh .env.local
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
